groups:
  - name: critical-service-alerts
    rules:
      - alert: HighErrorRate5xx
        expr: |
          100 * sum(rate(http_requests_total{code=~"5.."}[5m])) by (job)
            / sum(rate(http_requests_total[5m])) by (job) > 5
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | printf \"%.1f\" }}% (threshold 5%) for {{ $labels.job }}."

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le,job)
          ) > 1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High p99 latency on {{ $labels.job }}"
          description: "p99 latency is {{ $value | printf \"%.2f\" }}s (threshold 1s) for {{ $labels.job }}."

      - alert: HighCPUUtilization
        expr: |
          100 * rate(process_cpu_seconds_total[5m])
            / on(job) group_left process_cpu_cores_available > 90
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "CPU utilization critical on {{ $labels.job }}"
          description: "CPU at {{ $value | printf \"%.1f\" }}% (threshold 90%) for {{ $labels.job }}."

      - alert: HighMemorySaturation
        expr: |
          100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Memory saturation critical on {{ $labels.job }}"
          description: "Memory at {{ $value | printf \"%.1f\" }}% (threshold 90%) for {{ $labels.job }}."

      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Pod {{ $labels.pod }} is crash-looping"
          description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted {{ $value }} times/min."

      - alert: RequestRateDrop
        expr: |
          sum(rate(http_requests_total[5m])) by (job)
            < (sum(rate(http_requests_total[5m] offset 1h)) by (job)) * 0.5
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Request rate dropped significantly for {{ $labels.job }}"
          description: "Current rate is less than 50% of the rate 1h ago for {{ $labels.job }}."